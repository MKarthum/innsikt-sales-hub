name: Publiser kvalitetssikret rik kontekstillustrasjon
on:
  push:
    paths:
      - .github/workflows/publish-context-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Rendring, bildeversjon og godkjenningskontroll
        run: |
          python3 scripts/render-context-platform-image.py
          node scripts/presentation-illustrations.mjs revoke ai-context-platforms-2027 rich-image
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const recipe='scripts/presentation-illustrations.mjs';
          const old=fs.readFileSync(recipe,'utf8');
          const updated=old.replace("const recipeVersions={'rich-image':'1'}","const recipeVersions={'rich-image':'2'}");
          if(old===updated)throw Error('Expected previous renderer recipe version 1');
          fs.writeFileSync(recipe,updated);
          const path='docs/data/presentation-illustrations.json';
          const manifest=JSON.parse(fs.readFileSync(path,'utf8'));
          const entry=manifest.variants.find(x=>x.sourceSlideId==='ai-context-platforms-2027'&&x.styleId==='rich-image');
          if(!entry)throw Error('Rich context manifest entry missing');
          entry.renderRecipeVersion='2';
          fs.writeFileSync(path,JSON.stringify(manifest,null,2)+'\n');
          NODE
          node scripts/presentation-illustrations.mjs import ai-context-platforms-2027 rich-image media/illustrations/input-rich-image.png
          node scripts/presentation-illustrations.mjs approve ai-context-platforms-2027 rich-image "Visuelt og faglig kontrollert 2026-11-07" --faglig-ok --visuelt-ok
          node scripts/presentation-illustrations.mjs check
      - name: Publiser bare optimalisert bilde, innholdsregnskap og oppskrift
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/presentation-illustrations.mjs docs/data/presentation-illustrations.json docs/assets/illustrations/ai-context-platforms-2027-rich-image.webp
          git diff --cached --stat
          git commit -m "design: publish reviewed context-rich information architecture"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
