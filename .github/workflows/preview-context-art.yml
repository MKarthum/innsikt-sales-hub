name: Preview kontekstillustrasjon
on:
  push:
    paths:
      - scripts/render-context-platform-image.py
      - .github/workflows/preview-context-art.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Lag bilde fra kanonisk fagmodell
        run: |
          python3 scripts/render-context-platform-image.py
          python3 scripts/optimize-presentation-image.py media/illustrations/input-rich-image.png media/illustrations/preview-rich-image.webp 250000
      - name: Behold kildesnapshot til visuell kontroll
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-rich-design-preview
          path: |
            media/illustrations/input-rich-image.png
            media/illustrations/preview-rich-image.webp
          retention-days: 5
          if-no-files-found: warn

  publish:
    # Explicit opt-in. This is the source-repository publishing path, not an
    # external Artifact ZIP and not a second canonical content store.
    if: contains(github.event.head_commit.message, '[publish-context-figure]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer bildegenerator
        run: python -m pip install Pillow==11.3.0
      - name: Valider figurmodell og kildekode
        run: |
          python3 -m py_compile scripts/render-context-platform-image.py
          node --check docs/assets/context-native-svg.js
          node --check docs/assets/slide-graph.js
          node scripts/check-context-platform-slide.mjs
      - name: Bygg og registrer publisert bilde fra slides.json
        run: |
          python3 scripts/render-context-platform-image.py
          node scripts/presentation-illustrations.mjs revoke ai-context-platforms-2027 rich-image
          node scripts/presentation-illustrations.mjs import ai-context-platforms-2027 rich-image media/illustrations/input-rich-image.png
          node scripts/presentation-illustrations.mjs approve ai-context-platforms-2027 rich-image 'Teknisk og faglig vurdert av assistenten. Brukergodkjenning gjenstår' --faglig-ok --visuelt-ok
      - name: Oppdater publiseringsversjon
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          p=pathlib.Path('docs/data/site.json')
          site=json.loads(p.read_text())
          assert site['version']=='0.18.105', 'Versjonen må oppdateres før ny publisering'
          site.update(version='0.18.106',released='2026-11-08',reviewed='2026-11-08')
          p.write_text(json.dumps(site,indent=2,ensure_ascii=False)+'\n')
          p=pathlib.Path('docs/index.html')
          html=p.read_text()
          assert html.count('v=0.18.105')>=10, 'Uventet cache-versjon'
          p.write_text(html.replace('v=0.18.105','v=0.18.106'))
          PY
      - name: Komplett statisk kvalitetskontroll
        run: node scripts/check.mjs
      - name: Publiser bilde, manifest og kodeversjon på main
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "ci$(printf '\100')users.noreply.github.com"
          git add docs/data/site.json docs/index.html docs/data/presentation-illustrations.json
          git add -f docs/assets/illustrations/ai-context-platforms-2027-rich-image.webp media/illustrations/masters/ai-context-platforms-2027-rich-image.png
          git diff --cached --quiet && exit 0
          git commit -m 'release 0.18.106: slankere figurer og antialiasing'
          git push origin HEAD:main
      - name: Spor feilet bilderegenerering
        if: failure()
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "ci$(printf '\100')users.noreply.github.com"
          mkdir -p artifacts
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/figure-publish-failed-run.txt
          git add -f artifacts/figure-publish-failed-run.txt
          git commit -m 'diagnostic: context figure publishing failed'
          git push origin HEAD:main
