name: 'Figurbibliotek: forhåndsvisning og publisering'
on:
  push:
    paths:
      - scripts/illustration_kit.py
      - 'scripts/render-*.py'
      - scripts/build-illustration.mjs
      - scripts/optimize-presentation-image.py
      - scripts/presentation-illustrations.mjs
      - docs/data/illustration-recipes.json
      - docs/data/slides.json
      - docs/data/site.json
      - .github/workflows/preview-context-art.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer tegnebibliotek
        run: python3 -m pip install Pillow==11.3.0
      - name: Kontroller resepter, semantikk og Python-syntaks
        run: |
          python3 -m py_compile scripts/illustration_kit.py
          node --check scripts/build-illustration.mjs
          node scripts/check-illustration-pipeline.mjs
      - name: Lag to uavhengige illustrasjonsutkast fra slides.json
        run: node scripts/build-illustration.mjs all --preview
      - name: Behold fulloppløste utkast og optimert WebP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure-recipe-previews
          path: media/illustrations/previews/*
          retention-days: 7
          if-no-files-found: error

  publish:
    # Publishing is explicit, after the previews are visually inspected.
    if: contains(github.event.head_commit.message, '[publish-illustrations]')
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer tegnebibliotek
        run: python3 -m pip install Pillow==11.3.0
      - name: Oppdater alle manifestførte illustrasjoner
        run: node scripts/build-illustration.mjs all --publish
      - name: Øk versjon og oppdater cache-referanser
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          from datetime import date
          p=pathlib.Path('docs/data/site.json')
          site=json.loads(p.read_text())
          old=site['version']
          parts=old.split('.')
          assert len(parts)==3 and all(x.isdecimal() for x in parts)
          nxt='.'.join(parts[:2]+[str(int(parts[2])+1)])
          site.update(version=nxt,released=date.today().isoformat(),reviewed=date.today().isoformat())
          p.write_text(json.dumps(site,indent=2,ensure_ascii=False)+'\n')
          p=pathlib.Path('docs/index.html')
          html=p.read_text()
          assert html.count('v='+old)>=10
          p.write_text(html.replace('v='+old,'v='+nxt))
          PY
      - name: Kontroller all publisering
        run: node scripts/check.mjs
      - name: Lag én kildebasert release på main
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "ci$(printf '\100')users.noreply.github.com"
          git add docs/data/site.json docs/index.html docs/data/presentation-illustrations.json
          git add -f docs/assets/illustrations/*.webp media/illustrations/masters/*.png
          VERSION=$(python3 -c "import json;print(json.load(open('docs/data/site.json'))['version'])")
          git commit -m "release ${VERSION}: gjenbrukbare presentasjonsillustrasjoner"
          git push origin HEAD:main
