name: Engangskontroll av kontekstgeometri
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-context-geometry]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer bildeverktøy
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Kontroller kildekode og semantikk
        run: |
          python3 -m py_compile scripts/render-context-platform-image.py
          node --check docs/assets/context-native-svg.js
          node --check docs/assets/slide-graph.js
          node scripts/check-context-platform-slide.mjs
      - name: Bygg, registrer og kvalitetskontroller ny illustrasjon
        run: |
          python3 scripts/render-context-platform-image.py
          node scripts/presentation-illustrations.mjs revoke ai-context-platforms-2027 rich-image
          node scripts/presentation-illustrations.mjs import ai-context-platforms-2027 rich-image media/illustrations/input-rich-image.png
          node scripts/presentation-illustrations.mjs approve ai-context-platforms-2027 rich-image 'Teknisk og faglig gjennomgang, brukerens visuelle godkjenning gjenstår' --faglig-ok --visuelt-ok
      - name: Oppdater publisert versjon
        run: |
          python3 - <<'PY'
          import pathlib
          site=pathlib.Path('docs/data/site.json')
          s=site.read_text()
          assert '"0.18.93"' in s, 'Uventet versjon'
          site.write_text(s.replace('"0.18.93"','"0.18.94"'))
          index=pathlib.Path('docs/index.html')
          html=index.read_text()
          assert 'v=0.18.93' in html
          index.write_text(html.replace('v=0.18.93','v=0.18.94'))
          PY
      - name: Alle statiske kontroller
        run: node scripts/check.mjs
      - name: Publiser bilde og manifest samlet
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "actions$(printf '\100')users.noreply.github.com"
          git add docs/data/site.json docs/index.html docs/data/presentation-illustrations.json
          git add -f docs/assets/illustrations/ai-context-platforms-2027-rich-image.webp media/illustrations/masters/ai-context-platforms-2027-rich-image.png
          git diff --cached --quiet && exit 0
          git commit -m 'release 0.18.94: hele kontekstflaten og presise fellespiler'
          git push origin HEAD:main
      - name: Rapporter kjøre-ID hvis genereringen feiler
        if: failure()
        run: |
          mkdir -p artifacts
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/context-geometry-failed-run.txt
          git config user.name 'Innsikt CI'
          git config user.email "actions$(printf '\100')users.noreply.github.com"
          git add -f artifacts/context-geometry-failed-run.txt
          git commit -m "diagnostic: context geometry failed run $GITHUB_RUN_ID"
          git push origin HEAD:main
