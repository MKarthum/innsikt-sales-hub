name: Oppdater eksportbibliotek
on:
  push:
    paths:
      - scripts/slide-download-entry.mjs
      - .github/workflows/rebuild-slide-download.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bygg og publiser den reproduserbare eksportmodulen
        run: |
          npm run build:slide-download
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/slide-download.js
          if ! git diff --cached --quiet; then
            git commit -m "build: update slide download bundle"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
