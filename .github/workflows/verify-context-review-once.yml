name: Engangskontroll av visuelle eksporter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[review-browser-exports]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer nettlesere og avhengigheter
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Start statisk server
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/innsikt-review-server.log 2>&1 &
          sleep 2
      - name: Test ekte nedlastinger i Chromium
        run: EXPORT_BROWSER=chromium node scripts/check-context-platform-exports-browser.mjs
      - name: Test ekte nedlastinger i WebKit
        run: EXPORT_BROWSER=webkit node scripts/check-context-platform-exports-browser.mjs
      - name: Behold visuelle bevis og eksportfiler
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-visual-review
          path: |
            artifacts/context-exports-chromium/**
            artifacts/context-exports-webkit/**
          retention-days: 5
          if-no-files-found: warn
      - name: Loggfør kontrollens kjøre-ID
        if: always()
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "$(printf 'ci\100users.noreply.github.com')"
          python3 - <<'PY'
          import pathlib
          f=pathlib.Path('docs/data/site.json')
          text=f.read_text()
          assert '"0.18.98"' in text
          f.write_text(text.replace('"0.18.98"','"0.18.99"'))
          f=pathlib.Path('docs/index.html')
          text=f.read_text()
          assert 'v=0.18.98' in text
          f.write_text(text.replace('v=0.18.98','v=0.18.99'))
          PY
          git add docs/data/site.json docs/index.html
          git commit -m "verification $GITHUB_RUN_ID ${{ job.status }}"
          git push origin HEAD:main
