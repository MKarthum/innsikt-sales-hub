name: Kontroller Innsikt
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-syntaks
        run: |
          node --check docs/assets/content.js
          node --check docs/assets/site.js
          node --check docs/assets/learning.js
          node --check docs/assets/prompts.js
          node --check docs/assets/horizon.js
      - name: Publiceringskontroller
        run: node scripts/check.mjs
