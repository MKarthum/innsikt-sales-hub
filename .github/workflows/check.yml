name: Kontroller Innsikt
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS-syntaks
        run: node --check docs/assets/site.js
      - name: Data og kilder
        run: node scripts/check.mjs
