name: Kontroller Innsikt
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-syntaks
        run: |
          node --check docs/assets/glossary.js
          node --check docs/assets/presenter-export.js
          node --check docs/assets/content.js
          node --check docs/assets/dialogue.js
          node --check docs/assets/site.js
          node --check docs/assets/slide-visuals.js
          node --check docs/assets/slide-story-scenes.js
          node --check docs/assets/visual-assets.js
          node --check docs/assets/architecture-visuals.js
          node --check docs/assets/vendor-architectures.js
          node --check docs/assets/presentation-content.js
          node --check docs/assets/learning.js
          node --check docs/assets/prompt-context.js
          node --check docs/assets/prompts.js
          node --check docs/assets/horizon.js
      - name: Publiseringskontroller
        run: node scripts/check.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer testverktøy (ikke nettstedavhengigheter)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Installer Chromium og nettleseravhengigheter
        run: npx playwright install --with-deps chromium
      - name: Start lokal testserver
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/innsikt-http.log 2>&1 &
          sleep 2
      - name: Verifiser tema mot forrige release i Chromium
        run: |
          git worktree add --detach /tmp/innsikt-theme-previous HEAD^
          python3 -m http.server 8770 --bind 127.0.0.1 --directory /tmp/innsikt-theme-previous > /tmp/innsikt-theme-previous-http.log 2>&1 &
          sleep 2
          INNSIKT_THEME_BASE_URL=http://127.0.0.1:8770/docs/ node scripts/check-theme-browser.mjs
      - name: Kontroller helt nøytral syntetisk palett
        run: node scripts/check-theme-neutral-browser.mjs
      - name: Test faktisk mobil- og desktopvisning
        run: npm run check:browser

      - name: Kontroller visuell presentasjon og lag skjermbilder
        if: always()
        run: node scripts/check-visual-pilot.mjs
      - name: Kontroller navigasjonskontrakt for alle detaljruter
        run: node scripts/check-navigation-browser.mjs
      - name: Kontroller arkitekturdiagrammer og ressursbibliotek
        run: node scripts/check-architecture-browser.mjs
      - name: Kontroller palettvalg, eksport og beskyttet innhold
        run: node scripts/check-presentation-mode-browser.mjs
      - name: Kontroller animasjoner, gjenbruk og organisasjonsskin
        run: node scripts/check-presentation-motion-browser.mjs
      - name: Kontroller reproduserbar eksportkode
        run: |
          npm run build:slide-download
          git diff --exit-code -- docs/assets/slide-download.js
      - name: Bygg portabel Artifact-pakke uten originalarkiv
        run: npm run build:artifact
      - name: Kontroller eksport av enkeltlysbilder
        run: node scripts/check-single-slide-export-browser.mjs
      - name: Kontroller verdi-slide og organisasjonskins
        run: node scripts/check-value-system-browser.mjs
      - name: Kontroller redaksjonelt designsystem for alle lysbilder
        run: node scripts/check-slide-editorial-browser.mjs
      - name: Kontroller reelt ombygde, datadrevne lysbilder
        run: node scripts/check-slide-narratives-browser.mjs
      - name: Kontroller og render hele biblioteket
        if: always()
        run: node scripts/check-library-v1-browser.mjs
      - name: Behold ferdig Artifact-pakke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innsikt-portabel-artifact
          path: dist/innsikt-artifact.zip
          retention-days: 5
          if-no-files-found: warn
      - name: Behold skjermbilder for designgjennomgang
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innsikt-visual-pilot
          path: |
            artifacts/visual-pilot/*.png
            artifacts/library-v1/*.png
            artifacts/architecture/*.png
            artifacts/theme/*.png
          retention-days: 5
          if-no-files-found: warn

  context-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer testverktøy og Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start lokal testserver
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/innsikt-export-http.log 2>&1 &
          sleep 2
      - name: Kontroller alle 12 benchmark-eksporter, fullskjerm og Presenter
        run: node scripts/check-context-platform-exports-browser.mjs
      - name: Last opp faktiske eksportfiler og skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innsikt-context-exports
          path: artifacts/context-exports-chromium/**
          retention-days: 5
          if-no-files-found: warn

  context-exports-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer testverktøy og WebKit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps webkit
      - name: Start lokal testserver
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/innsikt-webkit-http.log 2>&1 &
          sleep 2
      - name: Kontroller benchmark-eksporter i WebKit
        run: EXPORT_BROWSER=webkit node scripts/check-context-platform-exports-browser.mjs
      - name: Last opp WebKit-baserte eksportfiler og skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innsikt-context-exports-webkit
          path: artifacts/context-exports-webkit/**
          retention-days: 5
          if-no-files-found: warn
