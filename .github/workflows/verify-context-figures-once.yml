name: Sammenlign nye kontekstfigurer i nettlesere
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  compare:
    if: contains(github.event.head_commit.message, '[verify-context-icons]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer nettlesere
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Start testnettsted
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/context-figures-server.log 2>&1 &
          sleep 2
      - name: Sammenlign skjerm og nedlastinger i Chromium
        run: EXPORT_BROWSER=chromium node scripts/check-context-platform-exports-browser.mjs
      - name: Sammenlign skjerm og nedlastinger i WebKit
        run: EXPORT_BROWSER=webkit node scripts/check-context-platform-exports-browser.mjs
      - name: Lagre skjermbilder og ekte nedlastinger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-figures-evidence
          path: |
            artifacts/context-exports-chromium/**
            artifacts/context-exports-webkit/**
          retention-days: 7
          if-no-files-found: error
      - name: Spor fullført nettleserkontroll
        if: always()
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "$(printf 'ci\100users.noreply.github.com')"
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/context-figures-browser-run.txt
          python3 - <<'PY'
          import pathlib
          f=pathlib.Path('docs/data/site.json')
          s=f.read_text()
          assert '"0.18.103"' in s
          f.write_text(s.replace('"0.18.103"','"0.18.104"'))
          f=pathlib.Path('docs/index.html')
          s=f.read_text()
          assert 'v=0.18.103' in s
          f.write_text(s.replace('v=0.18.103','v=0.18.104'))
          PY
          git add docs/data/site.json docs/index.html
          git add -f artifacts/context-figures-browser-run.txt
          git commit -m "verification iconography $GITHUB_RUN_ID ${{ job.status }}"
          git push origin HEAD:main
