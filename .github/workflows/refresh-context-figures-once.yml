name: Oppdater ikonografi for kontekstlysbildet
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[refresh-context-figures]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer rastertegner
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Kontroller kildekode og semantiske ikoner
        run: |
          python3 -m py_compile scripts/render-context-platform-image.py
          node --check docs/assets/context-native-svg.js
          node scripts/check-context-platform-slide.mjs
      - name: Generer versjonert illustrasjon fra slides.json
        run: |
          python3 scripts/render-context-platform-image.py
          node scripts/presentation-illustrations.mjs revoke ai-context-platforms-2027 rich-image
          node scripts/presentation-illustrations.mjs import ai-context-platforms-2027 rich-image media/illustrations/input-rich-image.png
          node scripts/presentation-illustrations.mjs approve ai-context-platforms-2027 rich-image 'Teknisk kontrollert ikonografi. Visuell brukergodkjenning gjenstår' --faglig-ok --visuelt-ok
      - name: Publiser ny versjon
        run: |
          python3 - <<'PY'
          import pathlib
          site=pathlib.Path('docs/data/site.json')
          s=site.read_text()
          assert '"0.18.101"' in s
          site.write_text(s.replace('"0.18.101"','"0.18.102"'))
          index=pathlib.Path('docs/index.html')
          html=index.read_text()
          assert 'v=0.18.101' in html
          index.write_text(html.replace('v=0.18.101','v=0.18.102'))
          PY
      - name: Allmenn datakvalitet og filvalidering
        run: node scripts/check.mjs
      - name: Lagre nye piktogrammer og bildemanifest på main
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "$(printf 'ci\100users.noreply.github.com')"
          mkdir -p artifacts
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/context-figures-run.txt
          git add docs/data/site.json docs/index.html docs/data/presentation-illustrations.json
          git add -f docs/assets/illustrations/ai-context-platforms-2027-rich-image.webp media/illustrations/masters/ai-context-platforms-2027-rich-image.png artifacts/context-figures-run.txt
          git commit -m 'release 0.18.102: semantiske figurer i alle tre varianter'
          git push origin HEAD:main
      - name: Skriv diagnose ved feil
        if: failure()
        run: |
          git config user.name 'Innsikt CI'
          git config user.email "$(printf 'ci\100users.noreply.github.com')"
          mkdir -p artifacts
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/context-figures-failed-run.txt
          git add -f artifacts/context-figures-failed-run.txt
          git commit -m 'diagnostic: ikonografi-generering feilet'
          git push origin HEAD:main
